name: Build DM-32UV Hytera SMS debug
on:
  push:
    branches: [build/dm32-hytera-sms-debug]
permissions:
  contents: read
jobs:
  dm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2c32a499a19f239d7bddc80aa50ef93db4a0390e
          persist-credentials: false
          submodules: recursive
      - name: Build and identify firmware
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2c32a499a19f239d7bddc80aa50ef93db4a0390e
          tools/docker/csky-toolchain/run.sh make -j2 BOARD=dm32 CONFIG_DEBUGLINK=y
          tools/docker/csky-toolchain/run.sh make BOARD=dm32 size
          sha256sum build/dm32/rfoundry_dm32.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dm32-hytera-sms-debug-2c32a499
          path: build/dm32/rfoundry_dm32.bin
          if-no-files-found: error
