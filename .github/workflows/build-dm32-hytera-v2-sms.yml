name: Build DM-32UV Hytera dedicated v2 SMS test
on:
  push:
    branches: [build/dm32-hytera-dedicated-v2]
permissions:
  contents: read
jobs:
  dm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d695d0b0bc34a892efb78dea0d01f981a33486df
          persist-credentials: false
          submodules: recursive
      - name: Build and identify firmware
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d695d0b0bc34a892efb78dea0d01f981a33486df
          make -C tests/host run-t3access dmrDataTest dmrDataServiceTest
          tests/host/dmrDataTest > /tmp/dmrDataTest.log || { tail -n 50 /tmp/dmrDataTest.log; exit 1; }
          tail -n 1 /tmp/dmrDataTest.log
          tests/host/dmrDataServiceTest
          tools/docker/csky-toolchain/run.sh make -j2 BOARD=dm32
          tools/docker/csky-toolchain/run.sh make BOARD=dm32 size
          sha256sum build/dm32/rfoundry_dm32.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dm32-hytera-dedicated-v2-d695d0b0
          path: build/dm32/rfoundry_dm32.bin
          if-no-files-found: error
