name: Build DM-32UV Hytera dedicated v2 SMS test
on:
  push:
    branches: [build/dm32-hytera-dedicated-v2]
permissions:
  contents: read
jobs:
  dm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eafa9cc62380dc81f72b5f76b89464b2bf55be2a
          persist-credentials: false
          submodules: recursive
      - name: Build and identify firmware
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = eafa9cc62380dc81f72b5f76b89464b2bf55be2a
          make -C tests/host run-t3access dmrDataTest dmrDataServiceTest
          tests/host/dmrDataTest > /tmp/dmrDataTest.log || { tail -n 50 /tmp/dmrDataTest.log; exit 1; }
          tail -n 1 /tmp/dmrDataTest.log
          tests/host/dmrDataServiceTest
          tools/docker/csky-toolchain/run.sh make -j2 BOARD=dm32
          tools/docker/csky-toolchain/run.sh make BOARD=dm32 size
          sha256sum build/dm32/rfoundry_dm32.bin
          tools/docker/csky-toolchain/run.sh csky-elf-objdump -dr build/dm32/core/dmr/dmrData.o > build/dm32/dmrData.dis
          tools/docker/csky-toolchain/run.sh csky-elf-objdump -dr build/dm32/core/dmr/dmrDataService.o > build/dm32/dmrDataService.dis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dm32-hytera-dedicated-v2-eafa9cc6
          path: |
            build/dm32/rfoundry_dm32.bin
            build/dm32/dmrData.dis
            build/dm32/dmrDataService.dis
          if-no-files-found: error
