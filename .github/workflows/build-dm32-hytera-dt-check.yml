name: Build DM-32UV Hytera data terminal check test
on:
  push:
    branches: [build/dm32-hytera-dt-reserved]
permissions:
  contents: read
jobs:
  dm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d2960f793e467821396c5109a8a7605d3ff07c71
          persist-credentials: false
          submodules: recursive
      - name: Build and identify firmware
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d2960f793e467821396c5109a8a7605d3ff07c71
          tools/docker/csky-toolchain/run.sh make -j2 BOARD=dm32
          tools/docker/csky-toolchain/run.sh make BOARD=dm32 size
          sha256sum build/dm32/rfoundry_dm32.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dm32-hytera-dt-reserved-d2960f79
          path: build/dm32/rfoundry_dm32.bin
          if-no-files-found: error
