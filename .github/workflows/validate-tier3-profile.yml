name: Validate dedicated Tier III packet data
on:
  push:
    branches: [build/validate-tier3-dedicated-data]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d6a07bc79d1eb5da7cc6f22e5140b21d706ebb3c
          persist-credentials: false
      - name: Host and editor tests
        run: |
          set -euo pipefail
          make -C tests/host -j3 t3AccessTest t3PduTest t3CodeplugTest dmrDataTest dmrDataServiceTest dmrDataServiceTestNoTms radioCoreTest
          for t in t3AccessTest t3PduTest t3CodeplugTest dmrDataTest dmrDataServiceTest dmrDataServiceTestNoTms radioCoreTest; do
            (cd tests/host && ./"$t") > "/tmp/$t.log" || { tail -n 60 "/tmp/$t.log"; exit 1; }
            tail -n 1 "/tmp/$t.log"
          done
          node --test site/tests/modes.test.mjs site/tests/editor.test.mjs
          python3 tools/check_generic.py
          python3 tools/i18n.py --check
          python3 tools/check_doc_links.py
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [dm1701, dm32]
        target: [d6a07bc79d1eb5da7cc6f22e5140b21d706ebb3c, afb378b388d44e28f0383165f3e17827f7bdaff7]
        include:
          - board: dm1701
            toolchain: arm
          - board: dm32
            toolchain: csky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.target }}
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/toolchain
        id: toolchain
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Firmware and task stacks
        env:
          BOARD_ID: ${{ matrix.board }}
          RUN_WITH: ${{ steps.toolchain.outputs.run }}
        run: |
          set -euo pipefail
          build() {
            $RUN_WITH make -j3 BOARD="$BOARD_ID" "$@" 2>&1 | tee /tmp/firmware-build.log
            if grep -F 'warning:' /tmp/firmware-build.log; then exit 1; fi
          }
          build
          $RUN_WITH make BOARD="$BOARD_ID" size stack-check
          if [[ "${{ matrix.target }}" == d6a07bc79d1eb5da7cc6f22e5140b21d706ebb3c ]]; then
            build CONFIG_DMR_TRUNK_DEDICATED_DATA=n BUILD=build/profile-off
            build CONFIG_DMR_TRUNK_TX=n BUILD=build/trunk-tx-off
            build CONFIG_DMR_TRUNK=n BUILD=build/trunk-off
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.board == 'dm32' && matrix.target == 'd6a07bc79d1eb5da7cc6f22e5140b21d706ebb3c'
        with:
          name: dm32-tier3-profile-d6a07bc7
          path: build/dm32/rfoundry_dm32.bin
          if-no-files-found: error
